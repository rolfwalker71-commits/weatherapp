<!doctype html>
<html lang="de-CH">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#f2f2f7" />
		<meta
			name="description"
			content="Wetter für die Schweiz und die Welt — aktuell, stündlich, 7 Tage, Luftqualität und Pollen."
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Wetter CH" />
		<script>
			(function () {
				try {
					// Native app: no pinch/double-tap zoom — the UI is laid out for the device width.
					if (window.Capacitor && window.Capacitor.isNativePlatform()) {
						document
							.querySelector('meta[name="viewport"]')
							.setAttribute(
								'content',
								'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover'
							);
					}
					var theme = localStorage.getItem('theme');
					var dark =
						theme === 'dark' ||
						(theme !== 'light' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

					// iOS design everywhere unless a chrome is picked explicitly (see resolveChrome).
					var pref = localStorage.getItem('chrome-pref') || 'auto';
					var chrome =
						pref === 'android' || pref === 'desktop' || pref === 'ios' ? pref : 'ios';
					document.documentElement.dataset.chrome = chrome;
					var themeColor = document.querySelector('meta[name="theme-color"]');
					if (themeColor) {
						if (chrome === 'ios') {
							themeColor.setAttribute('content', dark ? '#000000' : '#f2f2f7');
						} else if (chrome === 'desktop') {
							themeColor.setAttribute('content', dark ? '#202020' : '#f3f3f3');
						} else {
							themeColor.setAttribute('content', dark ? '#121314' : '#006874');
						}
					}
				} catch (e) {
					document.documentElement.dataset.chrome = 'ios';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
