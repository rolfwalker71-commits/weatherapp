<!doctype html>
<html lang="de-CH">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#006874" />
		<meta
			name="description"
			content="Wetter für die Schweiz und die Welt — aktuell, stündlich, 7 Tage, Luftqualität und Pollen."
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Wetter" />
		<script>
			(function () {
				try {
					var theme = localStorage.getItem('theme');
					var dark =
						theme === 'dark' ||
						(theme !== 'light' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

					var pref = localStorage.getItem('chrome-pref') || 'auto';
					var chrome =
						pref === 'auto'
							? window.matchMedia('(min-width: 1024px)').matches
								? 'desktop'
								: 'android'
							: pref;
					if (chrome !== 'android' && chrome !== 'desktop' && chrome !== 'ios') {
						chrome = 'android';
					}
					document.documentElement.dataset.chrome = chrome;
				} catch (e) {
					document.documentElement.dataset.chrome = 'android';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
