# Deprecated. Push is now inside the weather image (same container, /api/push).
# Keep this file only for old remotes that still run weatherapp-push.
# New deploys: docker compose pull && docker compose up -d  (docker-compose.yml only).

services:
  push:
    image: ghcr.io/${GHCR_IMAGE_PUSH:-rolfwalker71-commits/weatherapp-push}:${TAG:-latest}
    ports:
      - "4426:4426"
    environment:
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:weather@localhost}
      PUSH_SEND_ENABLED: ${PUSH_SEND_ENABLED:-true}
      PUSH_TEST_TOKEN: ${PUSH_TEST_TOKEN:-}
      PUSH_POLL_MS: ${PUSH_POLL_MS:-600000}
      SQLITE_PATH: /data/push.db
    volumes:
      - push-data:/data
    restart: unless-stopped

volumes:
  push-data:
