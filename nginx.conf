worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;
	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

	server {
		listen 4425;
		listen [::]:4425;
		server_name _;
		root /usr/share/nginx/html;
		index index.html 200.html;

		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header X-Frame-Options DENY always;

		# Variable + Docker DNS: resolve push at request time so nginx starts
		# when the optional companion (docker-compose.push.yml) is not running.
		location /api/push/ {
			resolver 127.0.0.11 valid=10s ipv6=off;
			set $push_upstream http://push:4426;
			rewrite ^/api/push/(.*)$ /$1 break;
			proxy_pass $push_upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_connect_timeout 2s;
			proxy_read_timeout 8s;
		}

		location / {
			try_files $uri $uri/ /index.html /200.html;
		}

		location ~* ^/(sw\.js|workbox-.*\.js)$ {
			add_header Cache-Control "no-cache, no-store, must-revalidate";
			try_files $uri =404;
		}

		location = /manifest.webmanifest {
			add_header Cache-Control "no-cache";
			try_files $uri =404;
		}

		location /_app/immutable/ {
			add_header Cache-Control "public, max-age=31536000, immutable";
			try_files $uri =404;
		}
	}
}
