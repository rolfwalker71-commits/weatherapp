worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;
	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

	server {
		listen 4425;
		listen [::]:4425;
		server_name _;
		root /usr/share/nginx/html;
		index index.html 200.html;

		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header X-Frame-Options DENY always;

		# Push API runs in this container on loopback (same image as the SPA).
		location /api/push/ {
			proxy_pass http://127.0.0.1:4426/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_connect_timeout 2s;
			proxy_read_timeout 8s;
		}

		location = /api/push {
			return 308 /api/push/;
		}

		# NOAA METAR (no CORS in the browser). Query string is forwarded as-is.
		location /api/metar {
			resolver 1.1.1.1 ipv6=off valid=300s;
			proxy_pass https://aviationweather.gov/api/data/metar$is_args$args;
			proxy_http_version 1.1;
			proxy_ssl_server_name on;
			proxy_set_header Host aviationweather.gov;
			proxy_set_header Origin "";
			proxy_connect_timeout 3s;
			proxy_read_timeout 6s;
		}

		location / {
			try_files $uri $uri/ /index.html /200.html;
		}

		location ~* ^/(sw\.js|workbox-.*\.js|push-sw\.js)$ {
			add_header Cache-Control "no-cache, no-store, must-revalidate";
			try_files $uri =404;
		}

		location = /manifest.webmanifest {
			add_header Cache-Control "no-cache";
			try_files $uri =404;
		}

		location /_app/immutable/ {
			add_header Cache-Control "public, max-age=31536000, immutable";
			try_files $uri =404;
		}
	}
}
